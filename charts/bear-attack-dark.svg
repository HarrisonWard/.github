<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Security programs are a continuous bear attack">
<rect width="900" height="560" fill="#1a1a19"/>
<text x="40" y="46" font-size="23" font-weight="700" fill="#ffffff">Security programs are a continuous bear attack</text>
<text x="40" y="72" font-size="14.5" fill="#c3c2b7">You can't be the fastest or you burn out. The slowest gets picked off.</text>
<line x1="70" y1="410.0" x2="650" y2="410.0" stroke="#33322f" stroke-width="1"/><text x="58" y="414.0" font-size="12" fill="#94938b" text-anchor="end">0</text><line x1="70" y1="338.8" x2="650" y2="338.8" stroke="#33322f" stroke-width="1"/><text x="58" y="342.8" font-size="12" fill="#94938b" text-anchor="end">25</text><line x1="70" y1="267.5" x2="650" y2="267.5" stroke="#33322f" stroke-width="1"/><text x="58" y="271.5" font-size="12" fill="#94938b" text-anchor="end">50</text><line x1="70" y1="196.2" x2="650" y2="196.2" stroke="#33322f" stroke-width="1"/><text x="58" y="200.2" font-size="12" fill="#94938b" text-anchor="end">75</text><line x1="70" y1="125.0" x2="650" y2="125.0" stroke="#33322f" stroke-width="1"/><text x="58" y="129.0" font-size="12" fill="#94938b" text-anchor="end">100</text><text x="70.0" y="434" font-size="12" fill="#94938b" text-anchor="middle">0</text><text x="215.0" y="434" font-size="12" fill="#94938b" text-anchor="middle">3</text><text x="360.0" y="434" font-size="12" fill="#94938b" text-anchor="middle">6</text><text x="505.0" y="434" font-size="12" fill="#94938b" text-anchor="middle">9</text><text x="650.0" y="434" font-size="12" fill="#94938b" text-anchor="middle">12</text><text x="360" y="460" font-size="12.5" fill="#c3c2b7" text-anchor="middle">Months into the program</text><text x="22" y="268" font-size="12.5" fill="#c3c2b7" text-anchor="middle" transform="rotate(-90 22 268)">Pace</text><path d="M 70.0 267.5 L 118.3 159.2 L 166.7 136.4 L 215.0 133.6 L 263.3 147.8 L 311.7 221.9 L 360.0 313.1 L 408.3 364.4 L 456.7 378.6 L 505.0 384.4 L 553.3 387.2 L 601.7 387.2 L 650.0 387.2" fill="none" stroke="#d95926" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="650.0" cy="387.2" r="4.5" fill="#d95926" stroke="#1a1a19" stroke-width="2"/><text x="664.0" y="392.2" font-size="13.5" font-weight="600" fill="#ffffff">Sprinter</text><text x="664.0" y="409.2" font-size="12" fill="#94938b">burns out</text><path d="M 70.0 290.3 L 118.3 253.2 L 166.7 239.0 L 215.0 233.3 L 263.3 230.4 L 311.7 227.6 L 360.0 227.6 L 408.3 224.8 L 456.7 221.9 L 505.0 221.9 L 553.3 219.0 L 601.7 216.2 L 650.0 216.2" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="650.0" cy="216.2" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="664.0" y="221.2" font-size="13.5" font-weight="600" fill="#ffffff">Steady</text><text x="664.0" y="238.2" font-size="12" fill="#94938b">still running</text><path d="M 70.0 324.5 L 118.3 330.2 L 166.7 333.1 L 215.0 338.8 L 263.3 341.6 L 311.7 344.4 L 360.0 347.3 L 408.3 350.1 L 456.7 353.0 L 505.0 355.9" fill="none" stroke="#199e70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="505.0" cy="355.9" r="6.5" fill="#1a1a19" stroke="#199e70" stroke-width="2"/><line x1="500.5" y1="351.4" x2="509.5" y2="360.4" stroke="#199e70" stroke-width="2"/><line x1="509.5" y1="351.4" x2="500.5" y2="360.4" stroke="#199e70" stroke-width="2"/><text x="521.0" y="360.9" font-size="13.5" font-weight="600" fill="#ffffff">Straggler</text><text x="521.0" y="377.9" font-size="12" fill="#94938b">picked off</text><line x1="40" y1="498" x2="860" y2="498" stroke="#33322f" stroke-width="1"/><text x="40" y="522" font-size="12.5" fill="#c3c2b7">The goal is not to win the race. It is to still be running when everyone else has stopped.</text></svg>